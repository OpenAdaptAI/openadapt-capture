name: TEMPORARY hosted-runner capability probe

on:
  push:
    branches: [ci/hosted-qualification-split]

permissions:
  contents: read

jobs:
  probe-linux:
    name: Probe hosted Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: System deps
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libportaudio2 xvfb x11-utils x11-xserver-utils \
            at-spi2-core dbus-x11 libgirepository1.0-dev gir1.2-atspi-2.0 || true
          ffmpeg -version | head -1 || echo "NO FFMPEG"

      - name: Install package
        run: |
          set -x
          uv venv --python 3.12 /tmp/qenv
          uv pip install --python /tmp/qenv/bin/python . pytest==9.1.1 pytest-timeout==2.4.0 pynput==1.8.2 || echo "BASE INSTALL FAILED"
          uv pip install --python /tmp/qenv/bin/python ".[linux]" || echo "LINUX EXTRA FAILED"

      - name: Xvfb single screen -> monitor count
        run: |
          set -x
          Xvfb :98 -screen 0 1280x1024x24 &
          sleep 3
          DISPLAY=:98 xdpyinfo | head -20 || true
          DISPLAY=:98 /tmp/qenv/bin/python -c "import mss;s=mss.mss();print('MONITORS_SINGLE', s.monitors)" || echo "MSS FAILED SINGLE"

      - name: Xvfb two screens + xinerama -> monitor count
        run: |
          set -x
          Xvfb :99 -screen 0 1280x1024x24 -screen 1 1280x1024x24 +xinerama &
          sleep 3
          DISPLAY=:99 xdpyinfo -ext XINERAMA | grep -i -A5 xinerama || true
          DISPLAY=:99 xrandr --listmonitors || echo "xrandr listmonitors failed"
          DISPLAY=:99 /tmp/qenv/bin/python -c "import mss;s=mss.mss();print('MONITORS_XINERAMA', s.monitors)" || echo "MSS FAILED XINERAMA"

      - name: Xvfb one screen + RandR setmonitor -> monitor count
        run: |
          set -x
          Xvfb :97 -screen 0 2560x1024x24 &
          sleep 3
          DISPLAY=:97 xrandr --setmonitor VIRT-1 1280/340x1024/270+0+0 none || echo "setmonitor 1 failed"
          DISPLAY=:97 xrandr --setmonitor VIRT-2 1280/340x1024/270+1280+0 none || echo "setmonitor 2 failed"
          DISPLAY=:97 xrandr --listmonitors || true
          DISPLAY=:97 /tmp/qenv/bin/python -c "import mss;s=mss.mss();print('MONITORS_SETMONITOR', s.monitors)" || echo "MSS FAILED SETMONITOR"

      - name: check_display_topology against each variant
        run: |
          set -x
          for d in :98 :99 :97; do
            echo "=== DISPLAY $d ==="
            DISPLAY=$d /tmp/qenv/bin/python scripts/check_display_topology.py --minimum-monitors 2 --output /tmp/topo$d.json || echo "TOPOLOGY FAILED on $d"
          done

      - name: Live recorder slow suite under Xvfb (xinerama)
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
          DISPLAY: ":99"
        run: |
          set -x
          /tmp/qenv/bin/python -m pytest tests/test_performance.py -m slow -v --timeout=300 \
            --import-mode=importlib --junitxml=/tmp/linux-perf.xml || echo "PERF SUITE FAILED"

      - name: Live structural observation under Xvfb
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
          DISPLAY: ":99"
        run: |
          set -x
          dbus-run-session -- /tmp/qenv/bin/python -m pytest tests/test_structural_observation.py -m slow -v --timeout=300 \
            --import-mode=importlib --junitxml=/tmp/linux-struct.xml || echo "STRUCT SUITE FAILED"

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-linux
          path: /tmp/*.xml
          if-no-files-found: warn

  probe-windows:
    name: Probe hosted Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Install
        shell: bash
        run: |
          choco install ffmpeg -y --no-progress || echo "ffmpeg install failed"
          uv venv --python 3.12 /c/qenv
          uv pip install --python /c/qenv/Scripts/python.exe . pytest==9.1.1 pytest-timeout==2.4.0 pynput==1.8.2

      - name: Monitor topology
        shell: bash
        run: |
          /c/qenv/Scripts/python.exe -c "import mss;s=mss.mss();print('MONITORS_WINDOWS', s.monitors)" || echo "MSS FAILED"
          /c/qenv/Scripts/python.exe scripts/check_display_topology.py --minimum-monitors 2 --output /c/topo.json || echo "TOPOLOGY 2MON FAILED"
          /c/qenv/Scripts/python.exe scripts/check_display_topology.py --minimum-monitors 1 --output /c/topo1.json || echo "TOPOLOGY 1MON FAILED"

      - name: Live suite WITH input injection (no suppression flag)
        shell: bash
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
        run: |
          /c/qenv/Scripts/python.exe -m pytest tests/test_performance.py -m slow -v --timeout=300 \
            --import-mode=importlib --junitxml=/c/win-perf.xml || echo "PERF SUITE FAILED"

      - name: Live structural observation
        shell: bash
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
        run: |
          /c/qenv/Scripts/python.exe -m pytest tests/test_structural_observation.py -m slow -v --timeout=300 \
            --import-mode=importlib --junitxml=/c/win-struct.xml || echo "STRUCT SUITE FAILED"

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-windows
          path: C:/*.xml
          if-no-files-found: warn

  probe-macos:
    name: Probe hosted macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Install
        run: |
          brew install ffmpeg || echo "ffmpeg failed"
          uv venv --python 3.12 /tmp/qenv
          uv pip install --python /tmp/qenv/bin/python . pytest==9.1.1 pytest-timeout==2.4.0 pynput==1.8.2

      - name: Monitor topology and screen capture permission
        run: |
          set -x
          /tmp/qenv/bin/python -c "import mss;s=mss.mss();print('MONITORS_MACOS', s.monitors)" || echo "MSS FAILED"
          /tmp/qenv/bin/python -c "
          import mss, hashlib
          with mss.mss() as s:
              img = s.grab(s.monitors[0])
              b = bytes(img.rgb)
              print('GRAB_BYTES', len(b), 'SHA', hashlib.sha256(b).hexdigest()[:16], 'DISTINCT', len(set(b)))
          " || echo "GRAB FAILED"
          /tmp/qenv/bin/python scripts/check_display_topology.py --minimum-monitors 2 --output /tmp/topo.json || echo "TOPOLOGY 2MON FAILED"
          /tmp/qenv/bin/python scripts/check_display_topology.py --minimum-monitors 1 --output /tmp/topo1.json || echo "TOPOLOGY 1MON FAILED"

      - name: Live suite
        env:
          OPENADAPT_CAPTURE_PRODUCTION_QUALIFICATION: "1"
        run: |
          /tmp/qenv/bin/python -m pytest tests/test_performance.py -m slow -v --timeout=300 \
            --import-mode=importlib --junitxml=/tmp/mac-perf.xml || echo "PERF SUITE FAILED"

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-macos
          path: /tmp/*.xml
          if-no-files-found: warn
